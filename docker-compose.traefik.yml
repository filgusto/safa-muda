# Traefik — Edge Reverse Proxy for App Platform
#
# Run this ONCE on the host (separate from the app compose):
#   docker compose -f docker-compose.traefik.yml up -d
#
# This creates the shared `traefik-net` network that the app compose joins.
# Traefik watches Docker labels for routing configuration.
#
# The explicit `name: traefik` keeps Traefik in its own project so that
# `docker compose -f docker-compose.prod.yml up --remove-orphans` does NOT
# consider app-traefik-* an orphan and stop it.

name: traefik
#
# TLS options:
#   A) Let's Encrypt (default below) — Traefik handles certificates automatically.
#   B) Cloudflare Tunnel — disable ports 80/443, use cloudflared instead.
#      In that case, set TRAEFIK_ENTRYPOINT_HTTPS to point to the tunnel.
#
# Environment variables (set in .env.traefik or on the host):
#   TRAEFIK_ACME_EMAIL  — your email for Let's Encrypt notifications
#   TRAEFIK_DOMAIN      — primary domain (e.g. app.example.com)

services:

  # ── Proxy do socket do Docker ────────────────────────────────────────────────
  # O Traefik é o único contêiner exposto à internet. Com o socket montado
  # direto nele, uma falha no Traefik viraria controle total do servidor (o
  # socket do Docker equivale a root, mesmo em :ro). Este proxy só deixa
  # passar LEITURA da lista de contêineres — o que o Traefik precisa para ler
  # os labels — e nega o resto (criar, executar, apagar, imagens, volumes…).
  # Fica numa rede interna, sem saída para fora e sem porta publicada.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: always
    environment:
      CONTAINERS: 1   # GET /containers/* — listar e inspecionar
      POST: 0         # nenhuma escrita
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  traefik:
    image: traefik:v3.6
    restart: always
    depends_on:
      - socket-proxy
    security_opt:
      - no-new-privileges:true
    command:
      # Sem API nem dashboard: ninguém usa, e cada porta administrativa a
      # menos é uma a menos para proteger. Para inspecionar as rotas, leia
      # os labels (`docker inspect`) ou ligue o log em DEBUG temporariamente.

      # ── Docker provider (via socket-proxy) ───────────────────────────────────
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.network=traefik-net"
      - "--providers.docker.exposedbydefault=false"

      # ── Entrypoints ──────────────────────────────────────────────────────────
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect HTTP → HTTPS globally
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

      # ── Let's Encrypt (ACME) ─────────────────────────────────────────────────
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"

      # ── Logging ──────────────────────────────────────────────────────────────
      - "--log.level=WARN"
      - "--accesslog=true"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Persist TLS certificates across restarts
      - traefik-letsencrypt:/letsencrypt

    networks:
      - traefik-net
      - socket-proxy

    deploy:
      resources:
        limits:
          memory: 128m

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ── Shared external network ───────────────────────────────────────────────────
# The app compose declares this as external and joins it.
networks:
  traefik-net:
    name: traefik-net
    driver: bridge
  # Só Traefik e socket-proxy; `internal` corta a saída para fora.
  socket-proxy:
    driver: bridge
    internal: true

volumes:
  traefik-letsencrypt:
    driver: local
