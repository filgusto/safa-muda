# Development Docker Compose — Safa Muda
# Usage: docker compose up -d --build
#
# Differences from docker-compose.prod.yml (intentional):
#   - Dockerfile target: dev  (hot-reload via next dev, no build step)
#   - Source code mounted for live edits
#   - Ports 3000 / 3900 bound to 127.0.0.1 (localhost access)
#   - No Nginx reverse proxy (connect directly to web:3000)
#   - Migrations run in dev too (no push:true — Payload foi removido)
#   - No restart:always / resource limits (dev convenience)
#   - Mailpit captura todo e-mail enviado (nada sai para a internet)

services:

  # ── Garage (armazenamento de objetos S3-compatível) ────────────────────────────
  # Substituiu o MinIO — ver docs/adr/0003-garage-no-lugar-do-minio.md.
  # `--single-node` monta sozinho o layout de um nó; bucket, chave e CORS ficam
  # com o garage-init abaixo. Sem console web: use o CLI, por exemplo
  #   docker compose exec garage /garage bucket info safa-muda-media
  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node"]
    ports:
      # Porta do host configurável para não colidir com outros projetos
      # rodando na mesma máquina — ver .env.example. A API de administração
      # (3903) não é exposta: só o garage-init fala com ela.
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"       # S3 API
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-63041e3a051ddf0f74a6e1dfc76b6db3f3aa9c0e4e73c6d35a5d098c1798db47}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-safa_muda_dev_admin_token}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - safa-muda-garage-data:/var/lib/garage
    networks:
      - safa-muda-net
    healthcheck:
      # A imagem não tem shell nem curl; o próprio binário serve de sonda.
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Garage: bucket, chave da aplicação e CORS (roda e sai) ─────────────────────
  garage-init:
    image: node:22-alpine
    command: ["node", "/garage-init.mjs"]
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - safa-muda-net
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-safa_muda_dev_admin_token}
      GARAGE_BUCKET: safa-muda-media
      GARAGE_APP_KEY_ID: ${GARAGE_APP_KEY_ID:-GKa81787c793d1dd5c5789d4e2}
      GARAGE_APP_SECRET_KEY: ${GARAGE_APP_SECRET_KEY:-d18cbe885d00f2ad6d9ee975aa3d607c70b7308947e514181f302c9be3b39cc8}
      APP_ORIGIN: http://localhost:${WEB_PORT:-3000}
    volumes:
      - ./garage/init.mjs:/garage-init.mjs:ro
    restart: "no"

  # ── Mailpit (SMTP de desenvolvimento) ─────────────────────────────────────────
  # Recebe todo e-mail que a aplicação envia e mostra numa caixa de entrada web,
  # sem entregar nada de verdade. SMTP em mailpit:1025 dentro da rede; a
  # interface fica em http://localhost:${MAILPIT_UI_PORT:-8025}.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"   # Interface web
    networks:
      - safa-muda-net

  # ── PostgreSQL + PostGIS ─────────────────────────────────────────────────────
  # PostGIS é exigido pelo mapa de plantio (fase 4): consultas espaciais sobre
  # áreas georreferenciadas. A extensão é criada em db/migrate.ts.
  postgres:
    # A imagem oficial do PostGIS só publica amd64. Em Apple Silicon ela roda
    # emulada (lenta); defina POSTGRES_IMAGE=imresamu/postgis:16-3.5 no .env
    # para a build multi-arquitetura da comunidade. Ver .env.example.
    image: ${POSTGRES_IMAGE:-postgis/postgis:16-3.4}
    volumes:
      - safa-muda-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: safa_muda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: safa_muda
    networks:
      - safa-muda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safa_muda -d safa_muda"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Migrations (roda uma vez e sai) ──────────────────────────────────────────
  # Diferente do boilerplate original: não há mais `push:true` do Payload, então
  # o schema é aplicado por migrations explícitas também em desenvolvimento.
  # Isso mantém dev e prod com o mesmo caminho e evita drift silencioso.
  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: dev
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgresql://safa_muda:${POSTGRES_PASSWORD}@postgres:5432/safa_muda
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - safa-muda-net
    volumes:
      - ./app:/app
      - /app/node_modules
    restart: "no"

  # ── Next.js ──────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: dev   # hot-reload via next dev
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://safa_muda:${POSTGRES_PASSWORD}@postgres:5432/safa_muda
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_SERVER_URL: http://localhost:${WEB_PORT:-3000}
      S3_ENDPOINT: http://garage:3900
      # O navegador não resolve "garage" — o upload pré-assinado precisa de um
      # host alcançável a partir da máquina do usuário. Ver lib/storage.ts.
      S3_PUBLIC_ENDPOINT: http://localhost:${GARAGE_S3_PORT:-3900}
      S3_BUCKET: safa-muda-media
      S3_ACCESS_KEY: ${GARAGE_APP_KEY_ID:-GKa81787c793d1dd5c5789d4e2}
      S3_SECRET_KEY: ${GARAGE_APP_SECRET_KEY:-d18cbe885d00f2ad6d9ee975aa3d607c70b7308947e514181f302c9be3b39cc8}
      # O env_file traz o .env inteiro; a aplicação não precisa dos segredos
      # de administração do Garage.
      GARAGE_RPC_SECRET: ""
      GARAGE_ADMIN_TOKEN: ""
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: Safa Muda <nao-responda@safamuda.local>
    depends_on:
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    networks:
      - safa-muda-net
    volumes:
      # Mount source for hot-reload during development
      - ./app:/app
      - /app/node_modules
      - /app/.next

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  safa-muda-pgdata:
    driver: local
  safa-muda-garage-data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  safa-muda-net:
    driver: bridge
