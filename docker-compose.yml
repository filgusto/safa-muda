# Development Docker Compose — Safa Muda
# Usage: docker compose up -d --build
#
# Differences from docker-compose.prod.yml (intentional):
#   - Dockerfile target: dev  (hot-reload via next dev, no build step)
#   - Source code mounted for live edits
#   - Ports 3000 / 9000 / 9001 bound to 0.0.0.0 (localhost access)
#   - No Nginx reverse proxy (connect directly to web:3000)
#   - Migrations run in dev too (no push:true — Payload foi removido)
#   - No restart:always / resource limits (dev convenience)

services:

  # ── MinIO object storage ──────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      # Portas do host são configuráveis para não colidir com outros projetos
      # rodando na mesma máquina — ver .env.example.
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-safa_muda}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-safa_muda_dev_secret}
    volumes:
      - safa-muda-minio-data:/data
    networks:
      - safa-muda-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── MinIO bucket initialisation (runs once, then exits) ───────────────────────
  createbuckets:
    image: minio/minio:latest   # same image as minio — mc is guaranteed available
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - safa-muda-net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-safa_muda}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-safa_muda_dev_secret}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing minio/safa-muda-media &&
        mc anonymous set download minio/safa-muda-media &&
        echo 'Bucket safa-muda-media ready.'
    restart: "no"

  # ── PostgreSQL + PostGIS ─────────────────────────────────────────────────────
  # PostGIS é exigido pelo mapa de plantio (fase 4): consultas espaciais sobre
  # áreas georreferenciadas. A extensão é criada em db/migrate.ts.
  postgres:
    # A imagem oficial do PostGIS só publica amd64. Em Apple Silicon ela roda
    # emulada (lenta); defina POSTGRES_IMAGE=imresamu/postgis:16-3.5 no .env
    # para a build multi-arquitetura da comunidade. Ver .env.example.
    image: ${POSTGRES_IMAGE:-postgis/postgis:16-3.4}
    volumes:
      - safa-muda-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: safa_muda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: safa_muda
    networks:
      - safa-muda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safa_muda -d safa_muda"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Migrations (roda uma vez e sai) ──────────────────────────────────────────
  # Diferente do boilerplate original: não há mais `push:true` do Payload, então
  # o schema é aplicado por migrations explícitas também em desenvolvimento.
  # Isso mantém dev e prod com o mesmo caminho e evita drift silencioso.
  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: dev
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgresql://safa_muda:${POSTGRES_PASSWORD}@postgres:5432/safa_muda
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - safa-muda-net
    volumes:
      - ./app:/app
      - /app/node_modules
    restart: "no"

  # ── Next.js ──────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: dev   # hot-reload via next dev
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://safa_muda:${POSTGRES_PASSWORD}@postgres:5432/safa_muda
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_SERVER_URL: http://localhost:${WEB_PORT:-3000}
      S3_ENDPOINT: http://minio:9000
      # O navegador não resolve "minio" — o upload pré-assinado precisa de um
      # host alcançável a partir da máquina do usuário. Ver lib/storage.ts.
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      S3_BUCKET: safa-muda-media
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-safa_muda}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-safa_muda_dev_secret}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    networks:
      - safa-muda-net
    volumes:
      # Mount source for hot-reload during development
      - ./app:/app
      - /app/node_modules
      - /app/.next

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  safa-muda-pgdata:
    driver: local
  safa-muda-minio-data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  safa-muda-net:
    driver: bridge
