# Production Docker Compose — App Platform
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Prerequisites:
#   1. Traefik must be running: docker compose -f docker-compose.traefik.yml up -d
#   2. .env.prod filled in (copy from .env.prod.example)
#
# Required env vars: POSTGRES_PASSWORD, AUTH_SECRET, NEXT_PUBLIC_SERVER_URL,
#                    GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN, GARAGE_APP_KEY_ID,
#                    GARAGE_APP_SECRET_KEY, TRAEFIK_DOMAIN, S3_PUBLIC_DOMAIN

services:

  # ── Garage (armazenamento de objetos S3-compatível) ────────────────────────────
  # Substituiu o MinIO — ver docs/adr/0003-garage-no-lugar-do-minio.md.
  # `--single-node` monta sozinho o layout de um nó; bucket, chave e CORS ficam
  # com o garage-init abaixo.
  garage:
    image: dxflrs/garage:v2.3.0
    restart: always
    command: ["/garage", "server", "--single-node"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?defina GARAGE_RPC_SECRET no .env.prod}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?defina GARAGE_ADMIN_TOKEN no .env.prod}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - safa-muda-garage-data:/var/lib/garage
    networks:
      - safa-muda-net
      - traefik-net    # necessário para o router de upload abaixo
    healthcheck:
      # A imagem não tem shell nem curl; o próprio binário serve de sonda.
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      # O upload é feito pelo navegador direto no Garage, via URL pré-assinada.
      # Isso exige um host público, porque a assinatura SigV4 cobre o cabeçalho
      # Host — não dá para assinar com `garage:3900` e proxiar depois.
      # Aponte S3_PUBLIC_DOMAIN (ex.: s3.seudominio.org) para este servidor.
      # Só a API S3 (3900) é roteada; RPC (3901) e administração (3903) ficam
      # fora do Traefik.
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.safa-muda-s3.rule=Host(`${S3_PUBLIC_DOMAIN:?defina S3_PUBLIC_DOMAIN no .env.prod}`)"
      - "traefik.http.routers.safa-muda-s3.entrypoints=websecure"
      - "traefik.http.routers.safa-muda-s3.tls=true"
      - "traefik.http.routers.safa-muda-s3.tls.certresolver=letsencrypt"
      - "traefik.http.routers.safa-muda-s3.service=safa-muda-s3"
      - "traefik.http.services.safa-muda-s3.loadbalancer.server.port=3900"
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Garage: bucket, chave da aplicação e CORS (roda e sai) ─────────────────────
  garage-init:
    image: node:22-alpine
    command: ["node", "/garage-init.mjs"]
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - safa-muda-net
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?defina GARAGE_ADMIN_TOKEN no .env.prod}
      GARAGE_BUCKET: safa-muda-media
      GARAGE_APP_KEY_ID: ${GARAGE_APP_KEY_ID:?defina GARAGE_APP_KEY_ID no .env.prod}
      GARAGE_APP_SECRET_KEY: ${GARAGE_APP_SECRET_KEY:?defina GARAGE_APP_SECRET_KEY no .env.prod}
      APP_ORIGIN: ${NEXT_PUBLIC_SERVER_URL:?defina NEXT_PUBLIC_SERVER_URL no .env.prod}
    volumes:
      - ./garage/init.mjs:/garage-init.mjs:ro
    user: node
    restart: "no"

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    restart: always
    volumes:
      - safa-muda-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: safa_muda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.prod}
      POSTGRES_DB: safa_muda
    networks:
      - safa-muda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safa_muda -d safa_muda"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Database migrations ───────────────────────────────────────────────────────
  # Roda `npm run db:migrate`: cria a extensão PostGIS e aplica as migrations pendentes, depois sai.
  # Web will not start unless this service exits with code 0.
  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: migrator
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://safa_muda:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.prod}@postgres:5432/safa_muda
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    networks:
      - safa-muda-net
    user: node
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Next.js ──────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: runner
      # Embutidas no bundle do navegador em tempo de build (ver Dockerfile).
      # Mudou alguma? Reconstrua a imagem: `up -d --build`.
      args:
        NEXT_PUBLIC_SATELLITE_TILE_URL: ${NEXT_PUBLIC_SATELLITE_TILE_URL:-}
        NEXT_PUBLIC_SATELLITE_ATTRIBUTION: ${NEXT_PUBLIC_SATELLITE_ATTRIBUTION:-}
        NEXT_PUBLIC_SATELLITE_MAX_ZOOM: ${NEXT_PUBLIC_SATELLITE_MAX_ZOOM:-}
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://safa_muda:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.prod}@postgres:5432/safa_muda
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env.prod}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?defina NEXT_PUBLIC_SERVER_URL no .env.prod}
      S3_ENDPOINT: http://garage:3900
      S3_PUBLIC_ENDPOINT: https://${S3_PUBLIC_DOMAIN:?defina S3_PUBLIC_DOMAIN no .env.prod}
      S3_BUCKET: safa-muda-media
      S3_ACCESS_KEY: ${GARAGE_APP_KEY_ID:?defina GARAGE_APP_KEY_ID no .env.prod}
      S3_SECRET_KEY: ${GARAGE_APP_SECRET_KEY:?defina GARAGE_APP_SECRET_KEY no .env.prod}
      # O env_file traz o .env.prod inteiro; a aplicação não precisa (nem deve
      # ter) os segredos de administração do Garage.
      GARAGE_RPC_SECRET: ""
      GARAGE_ADMIN_TOKEN: ""
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    networks:
      - safa-muda-net
      - traefik-net    # joins the shared Traefik network for routing
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3g
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    labels:
      # ── Tell Traefik to route this container ──────────────────────────────
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"

      # ── Main app router (HTTPS) ───────────────────────────────────────────
      - "traefik.http.routers.app.rule=Host(`${TRAEFIK_DOMAIN:?defina TRAEFIK_DOMAIN no .env.prod}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
      # Health check so Traefik only routes to a healthy container
      - "traefik.http.services.app.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.app.loadbalancer.healthcheck.interval=30s"

      # ── Security headers middleware ────────────────────────────────────────
      - "traefik.http.middlewares.app-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.app-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.app-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.app-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.app-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.app-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.app-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.app-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
      - "traefik.http.middlewares.app-headers.headers.customResponseHeaders.X-Permitted-Cross-Domain-Policies=none"
      # script-src sem 'unsafe-eval': o bundle de produção do Next não usa
      # eval (só o `next dev` precisa, e a política dele fica em
      # app/next.config.mjs). Se alguma dependência nova passar a exigir, o
      # navegador acusa "EvalError"/"unsafe-eval" no console.
      # challenges.cloudflare.com (script-src e frame-src): desafio anti-robô
      # do cadastro, quando TURNSTILE_* estão definidas (app/lib/captcha.ts).
      # img-src: além do próprio site, os tiles do mapa de fundo
      # (lib/tiles.ts), a prévia de importação do Wikimedia Commons
      # (components/catalogo/LinkDoWikimedia.tsx) e, se configurado, o provedor
      # de satélite (SATELLITE_TILE_ORIGIN). Mantenha em sincronia com
      # app/next.config.mjs, que aplica a mesma política em desenvolvimento.
      - "traefik.http.middlewares.app-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://upload.wikimedia.org ${SATELLITE_TILE_ORIGIN:-}; font-src 'self' data:; connect-src 'self' https://${S3_PUBLIC_DOMAIN:?defina S3_PUBLIC_DOMAIN no .env.prod}; worker-src blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"
      - "traefik.http.routers.app.middlewares=app-headers"

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  safa-muda-pgdata:
    driver: local
  safa-muda-garage-data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  safa-muda-net:
    driver: bridge
    name: safa-muda-net   # nome fixo: o backup-db.sh entra nesta rede
  traefik-net:
    external: true   # created and managed by docker-compose.traefik.yml
    name: traefik-net
