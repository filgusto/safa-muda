# Production Docker Compose — App Platform
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Prerequisites:
#   1. Traefik must be running: docker compose -f docker-compose.traefik.yml up -d
#   2. .env.prod filled in (copy from .env.prod.example)
#
# Required env vars: POSTGRES_PASSWORD, AUTH_SECRET, NEXT_PUBLIC_SERVER_URL,
#                    MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, TRAEFIK_DOMAIN,
#                    S3_PUBLIC_DOMAIN

services:

  # ── MinIO object storage ──────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - safa-muda-minio-data:/data
    networks:
      - safa-muda-net
      - traefik-net    # necessário para o router de upload abaixo
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      # O upload é feito pelo navegador direto no MinIO, via URL pré-assinada.
      # Isso exige um host público, porque a assinatura SigV4 cobre o cabeçalho
      # Host — não dá para assinar com `minio:9000` e proxiar depois.
      # Aponte S3_PUBLIC_DOMAIN (ex.: s3.seudominio.org) para este servidor.
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.safa-muda-s3.rule=Host(`${S3_PUBLIC_DOMAIN}`)"
      - "traefik.http.routers.safa-muda-s3.entrypoints=websecure"
      - "traefik.http.routers.safa-muda-s3.tls=true"
      - "traefik.http.routers.safa-muda-s3.tls.certresolver=letsencrypt"
      - "traefik.http.routers.safa-muda-s3.service=safa-muda-s3"
      - "traefik.http.services.safa-muda-s3.loadbalancer.server.port=9000"
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── MinIO bucket initialisation (runs once, then exits) ───────────────────────
  createbuckets:
    image: minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - safa-muda-net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing minio/safa-muda-media &&
        mc anonymous set download minio/safa-muda-media &&
        echo 'Bucket safa-muda-media ready.'
    restart: "no"

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    restart: always
    volumes:
      - safa-muda-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: safa_muda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: safa_muda
    networks:
      - safa-muda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safa_muda -d safa_muda"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Database migrations ───────────────────────────────────────────────────────
  # Roda `npm run db:migrate`: cria a extensão PostGIS e aplica as migrations pendentes, depois sai.
  # Web will not start unless this service exits with code 0.
  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://safa_muda:${POSTGRES_PASSWORD}@postgres:5432/safa_muda
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${S3_PUBLIC_DOMAIN}
      S3_BUCKET: safa-muda-media
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - safa-muda-net
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Next.js ──────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: runner
    restart: always
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://safa_muda:${POSTGRES_PASSWORD}@postgres:5432/safa_muda
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${S3_PUBLIC_DOMAIN}
      S3_BUCKET: safa-muda-media
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    networks:
      - safa-muda-net
      - traefik-net    # joins the shared Traefik network for routing
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3g
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    labels:
      # ── Tell Traefik to route this container ──────────────────────────────
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"

      # ── Main app router (HTTPS) ───────────────────────────────────────────
      - "traefik.http.routers.app.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
      # Health check so Traefik only routes to a healthy container
      - "traefik.http.services.app.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.app.loadbalancer.healthcheck.interval=30s"

      # ── Security headers middleware ────────────────────────────────────────
      - "traefik.http.middlewares.app-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.app-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.app-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.app-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.app-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.app-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.app-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.app-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
      - "traefik.http.middlewares.app-headers.headers.customResponseHeaders.X-Permitted-Cross-Domain-Policies=none"
      - "traefik.http.middlewares.app-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https: blob:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net; worker-src blob:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"
      - "traefik.http.routers.app.middlewares=app-headers"

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  safa-muda-pgdata:
    driver: local
  safa-muda-minio-data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  safa-muda-net:
    driver: bridge
  traefik-net:
    external: true   # created and managed by docker-compose.traefik.yml
    name: traefik-net
